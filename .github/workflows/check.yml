name: テニスコート空き状況チェック

on:
  schedule:
    - cron: "0 22 * * *"  # JST 7:00
    - cron: "0 10 * * *"  # JST 19:00
  workflow_dispatch:
    inputs:
      count:
        description: "対象日を何日分取得するか（既定は土日祝のみ）"
        default: "7"
      all_days:
        description: "平日も含める"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tennis-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 前回の結果を取得（NEW 印の判定用）
        uses: actions/cache/restore@v4
        with:
          path: results/latest.json
          key: latest-json-${{ github.run_id }}
          restore-keys: latest-json-
      - name: 空き状況を取得
        env:
          COUNT: ${{ inputs.count || '7' }}
          ALL_DAYS: ${{ inputs.all_days }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count は数字で指定してください: $COUNT"; exit 1;; esac
          ARGS=(--count "$COUNT")
          if [ "$ALL_DAYS" = "true" ]; then ARGS+=(--all-days); fi
          python checker.py "${ARGS[@]}"
      - name: 今回の結果を保存（次回の NEW 判定用）
        if: success()
        uses: actions/cache/save@v4
        with:
          path: results/latest.json
          key: latest-json-${{ github.run_id }}
      - name: 公開用ファイルを用意
        if: always()
        run: |
          # フォルダ名が Vercel のプロジェクト名（= URL）になる
          mkdir -p narashino-tennis
          if [ -f results/latest.html ]; then cp results/latest.html narashino-tennis/index.html; fi
          cp results/latest.json narashino-tennis/ 2>/dev/null || true
      - name: Vercel に公開
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN が未設定です（Settings → Secrets and variables → Actions）"; exit 1; }
          test -f narashino-tennis/index.html || { echo "公開するページがありません"; exit 1; }
          cd narashino-tennis
          npx --yes vercel@39 deploy --prod --yes --token "$VERCEL_TOKEN" --scope yoheis-projects-1782b94d
