name: テニスコート空き状況チェック

on:
  schedule:
    # 毎時0分は GitHub 側が混雑して遅延・取りこぼしが起きやすいので、少しずらす。
    # 起動が数十分遅れることもあるため、7時/19時に間に合うよう早めに設定。
    - cron: "37 21 * * *"  # JST 6:37
    - cron: "37 9 * * *"   # JST 18:37
  workflow_dispatch:
    inputs:
      count:
        description: "対象日を何日分取得するか（既定は土日祝のみ）"
        default: "7"
      all_days:
        description: "平日も含める"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tennis-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: 前回の結果を取得（NEW 印の判定用）
        run: |
          mkdir -p results
          curl -fsSL "https://yhiotsuka.github.io/narashino-tennis-checker/latest.json" -o results/latest.json || rm -f results/latest.json
      - name: 空き状況を取得
        env:
          COUNT: ${{ inputs.count || '7' }}
          ALL_DAYS: ${{ inputs.all_days }}
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count は数字で指定してください: $COUNT"; exit 1;; esac
          ARGS=(--count "$COUNT")
          if [ "$ALL_DAYS" = "true" ]; then ARGS+=(--all-days); fi
          python checker.py "${ARGS[@]}"
      - name: 公開用ファイルを用意
        if: always()
        run: |
          mkdir -p site
          if [ -f results/latest.html ]; then cp results/latest.html site/index.html; fi
          cp results/*.json results/*.csv site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
